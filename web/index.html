<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dwarven Fortresses</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; }
    canvas { image-rendering: pixelated; }
  </style>
</head>
<body>
  <script src="wasm_exec.js"></script>
  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("game.wasm?v=" + Date.now()), go.importObject).then(result => {
      go.run(result.instance);
    });
  </script>
</body>
</html>
